spring.application.name=nutrivifs
server.port=8080

# Cada valor se puede cambiar con una variable de entorno (DB_URL, DB_USER, DB_PASSWORD, JWT_SECRET).
# Si no existe, se usa el valor por defecto de la derecha, pensado para desarrollo local (XAMPP).
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/nutrivifs}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT: clave SOLO de desarrollo. En un despliegue real se define JWT_SECRET.
jwt.secret=${JWT_SECRET:Y2xhdmUtc29sby1wYXJhLWRlc2Fycm9sbG8tbnV0cml2aWZzLW5vLXVzYXItZW4tcHJvZHVjY2lvbg==}
jwt.expiration-ms=3600000

# Swagger: http://localhost:8080/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html

# Subida de imagenes de productos (maximo 5 MB por archivo)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB