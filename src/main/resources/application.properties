spring.application.name=nutrivifs
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/nutrivifs

spring.datasource.username=root
spring.datasource.password=

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT: clave secreta en Base64 y duracion del token (1 hora)
jwt.secret=dW5hY2xhdmVzZWNyZXRhbXV5c2VndXJheWRpZmljaWxkZWF2aW5nYXIxMjM0NTY=
jwt.expiration-ms=3600000

# Swagger: http://localhost:8080/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
# Subida de imágenes de productos (máximo 5 MB por archivo)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
